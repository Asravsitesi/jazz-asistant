<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f9fe"><title>Jazz — Hesap doğrulama</title><link rel="stylesheet" href="auth.css?v=7000"><link rel="stylesheet" href="auth-v7.css?v=7000"></head><body><section class="auth-overlay"><div class="callback-card"><div class="auth-brand callback-brand"><span class="auth-brand-mark">J</span> Jazz</div><div class="auth-state" id="callbackState"><div class="auth-state-icon auth-spinner">◌</div><p class="auth-kicker">GÜVENLİ DOĞRULAMA</p><h2>Bağlantı kontrol ediliyor</h2><p>İşleminiz birkaç saniye içinde tamamlanacak.</p></div></div></section><script>const API='https://ilgggxhaljsykkyvfhpf.supabase.co/functions/v1/jazz-auth',KEY='sb_publishable_D-MIbf-eEhEQNrhdaVhBuQ_4qF37680',state=document.getElementById('callbackState'),params=new URLSearchParams(location.search),type=params.get('type')||'signup',token=params.get('token')||'';const show=(ok,title,text,button='Giriş ekranına dön')=>{state.innerHTML=`<div class="auth-state-icon">${ok?'✓':'!'}</div><p class="auth-kicker">${ok?'İŞLEM TAMAMLANDI':'BAĞLANTI GEÇERSİZ'}</p><h2>${title}</h2><p>${text}</p><div class="auth-state-actions"><a href="./${ok&&type==='signup'?'?confirmed=1':''}">${button}</a></div>`};async function call(body){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'application/json',apikey:KEY},body:JSON.stringify(body)}),d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.message||'İşlem tamamlanamadı.');return d}async function run(){if(!token)return show(false,'Bağlantı eksik','E-postadaki bağlantıyı yeniden açın.');if(type==='recovery'){state.innerHTML=`<div class="auth-state-icon">⌁</div><p class="auth-kicker">ŞİFRE YENİLEME</p><h2>Yeni şifrenizi belirleyin</h2><form class="auth-form" id="resetForm"><label class="auth-field"><span>Yeni şifre</span><input id="newPassword" type="password" minlength="8" autocomplete="new-password" required></label><div class="auth-message" id="resetMessage"></div><button class="auth-submit">Şifreyi güncelle</button></form>`;document.getElementById('resetForm').onsubmit=async e=>{e.preventDefault();const b=e.currentTarget.querySelector('button');b.disabled=true;try{const d=await call({action:'reset',type,token,password:document.getElementById('newPassword').value});show(true,'Şifreniz yenilendi',d.message)}catch(err){const m=document.getElementById('resetMessage');m.textContent=err.message;m.className='auth-message show error';b.disabled=false}};return}try{const d=await call({action:'confirm',type,token});show(true,'E-posta adresiniz doğrulandı',d.message);setTimeout(()=>location.replace('./?confirmed=1'),2200)}catch(err){show(false,'Doğrulama tamamlanamadı',err.message)}}run();</script></body></html>
