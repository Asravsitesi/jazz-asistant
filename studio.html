<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#11101a"><title>Jazz Studio</title><style>*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui;background:#0c0b12;color:#eae9f4}button,input,select,textarea{font:inherit}.studio{height:100%;display:grid;grid-template:58px 1fr/270px 1fr 320px}.top{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 14px;background:#15131e;border-bottom:1px solid #2a2736}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#7c5cff,#4ad7d1);display:grid;place-items:center;font-weight:900}.top b{margin-right:15px}.top button,.top select{height:36px;border:1px solid #343044;background:#1d1a28;color:#ddd;border-radius:9px;padding:0 11px}.top .publish{margin-left:auto;background:#7255ef;color:white;border:0}.library{background:#12101a;border-right:1px solid #2a2736;padding:13px;overflow:auto}.search{width:100%;padding:10px;border:1px solid #332f40;background:#1a1823;color:white;border-radius:9px}.category{font-size:10px;color:#858194;text-transform:uppercase;letter-spacing:1px;margin:18px 3px 7px}.module{display:grid;grid-template-columns:31px 1fr;align-items:center;gap:9px;width:100%;padding:8px;margin:5px 0;border:1px solid #302c3d;background:#191722;color:#ddd;border-radius:9px;text-align:left}.module i{width:30px;height:30px;border-radius:8px;background:#292441;color:#9a84ff;display:grid;place-items:center;font-style:normal}.module small{display:block;color:#777486}.canvas{position:relative;overflow:hidden;background-color:#0f0e16;background-image:radial-gradient(#353143 1px,transparent 1px);background-size:22px 22px}.scene{position:absolute;width:4000px;height:3000px}.node{position:absolute;width:210px;background:#191722;border:1px solid #3a354a;border-radius:12px;box-shadow:0 12px 30px #0007}.node.sel{border-color:#8064ff}.node .head{padding:8px 11px;border-radius:11px 11px 0 0;background:#28233f;color:#a996ff;font-size:10px;font-weight:800;text-transform:uppercase}.node .body{padding:12px}.node .body small{display:block;color:#7f7b8d;margin-top:5px}.port{position:absolute;top:45px;width:12px;height:12px;border-radius:50%;border:2px solid #0f0e16;background:#846aff}.port.in{left:-7px}.port.out{right:-7px}.inspector{background:#12101a;border-left:1px solid #2a2736;padding:17px;overflow:auto}.hint{color:#817e8e;font-size:12px}.field{display:grid;gap:6px;margin:15px 0}.field input,.field textarea{width:100%;border:1px solid #353044;background:#1a1823;color:#eee;border-radius:9px;padding:10px}.field textarea{height:180px}.save{width:100%;padding:11px;border:0;border-radius:9px;background:#7255ef;color:white}.empty{margin-top:80px;text-align:center;color:#777486}@media(max-width:850px){.studio{grid-template:58px 1fr/1fr}.library,.inspector{display:none}.top{grid-column:1}.top b{display:none}}</style></head><body><div class="studio"><header class="top"><span class="logo">J</span><b>Jazz Studio</b><button onclick="location.href='index.html'">← Asistana dön</button><select><option>Ana Akış</option></select><button id="layout">Otomatik düzenle</button><button onclick="location.href='index.html'">Test</button><button class="publish" id="publish">Yayınla</button></header><aside class="library"><input class="search" id="search" placeholder="Modül ara"><div id="modules"></div></aside><main class="canvas" id="canvas"><div class="scene" id="scene"></div></main><aside class="inspector" id="inspector"></aside></div><script>const catalog=[['Mesaj','message','T','Metin mesajı'],['Mesaj','media','▧','Görsel / video / dosya'],['Mesaj','quick','☷','Hızlı yanıtlar'],['Girdi','input','Aa','Kullanıcı girdisi'],['Girdi','choice','✓','Seçenek toplama'],['Mantık','condition','⑂','Koşullu dallanma'],['Mantık','variable','{}','Değişken ata'],['Mantık','delay','◷','Bekleme'],['Yapay Zekâ','ai','✦','Model yanıtı'],['Yapay Zekâ','knowledge','⌕','Bilgi tabanı arama'],['Yapay Zekâ','intent','◎','Niyet algılama'],['Entegrasyon','webhook','↯','Webhook'],['Entegrasyon','api','⇄','REST API'],['Entegrasyon','tool','⚙','Araç çağırma'],['İnsan','handover','♙','Canlı desteğe aktar'],['Akış','end','■','Akışı bitir']];let nodes=JSON.parse(localStorage.jazzFlow||'null')||[{id:'start',type:'start',name:'Başlangıç',x:90,y:120,config:{}},{id:'ai',type:'ai',name:'Jazz AI',x:390,y:120,config:{provider:'auto',memory:true}},{id:'end',type:'end',name:'Bitiş',x:690,y:120,config:{}}],sel=null,from=null;const $=s=>document.querySelector(s),meta=t=>catalog.find(x=>x[1]===t)||['Akış',t,'◇',t];function save(){localStorage.jazzFlow=JSON.stringify(nodes)}function library(q=''){let cat='';modules.innerHTML=catalog.filter(x=>x.join(' ').toLowerCase().includes(q.toLowerCase())).map(x=>{let h='';if(cat!==x[0]){cat=x[0];h=`<div class="category">${cat}</div>`}return h+`<button draggable="true" class="module" data-type="${x[1]}"><i>${x[2]}</i><span>${x[3]}<small>${x[1]}</small></span></button>`}).join('');document.querySelectorAll('.module').forEach(x=>x.ondragstart=e=>e.dataTransfer.setData('type',x.dataset.type))}function render(){scene.innerHTML=nodes.map(n=>{const m=meta(n.type);return `<article class="node ${sel?.id===n.id?'sel':''}" data-id="${n.id}" style="left:${n.x}px;top:${n.y}px"><button class="port in"></button><div class="head">${m[2]} ${m[0]}</div><div class="body"><b>${n.name}</b><small>${m[3]}</small></div><button class="port out"></button></article>`}).join('');document.querySelectorAll('.node').forEach(bind);inspect()}function bind(el){const n=nodes.find(x=>x.id===el.dataset.id);el.onclick=e=>{e.stopPropagation();if(e.target.classList.contains('out')){from=n;return}if(e.target.classList.contains('in')&&from){from.config.next=n.id;from=null;save();render();return}sel=n;render()};let sx,sy,ox,oy;el.onpointerdown=e=>{if(e.target.classList.contains('port'))return;sx=e.clientX;sy=e.clientY;ox=n.x;oy=n.y;el.setPointerCapture(e.pointerId);el.onpointermove=m=>{n.x=Math.round((ox+m.clientX-sx)/10)*10;n.y=Math.round((oy+m.clientY-sy)/10)*10;el.style.left=n.x+'px';el.style.top=n.y+'px'};el.onpointerup=()=>{el.onpointermove=null;save()}}}function inspect(){if(!sel)return inspector.innerHTML='<div class="empty"><h3>Özellikler</h3><p>Bir modül seçin.</p></div>';inspector.innerHTML=`<h3>${meta(sel.type)[3]}</h3><p class="hint">Bu adımın davranışını düzenleyin.</p><div class="field"><input id="name" value="${sel.name}"></div><div class="field"><textarea id="config">${JSON.stringify(sel.config,null,2)}</textarea></div><button class="save" id="saveNode">Kaydet</button>`;saveNode.onclick=()=>{try{sel.name=name.value;sel.config=JSON.parse(config.value||'{}');save();render()}catch{alert('JSON geçersiz')}}}canvas.ondragover=e=>e.preventDefault();canvas.ondrop=e=>{e.preventDefault();const t=e.dataTransfer.getData('type'),m=meta(t);nodes.push({id:crypto.randomUUID(),type:t,name:m[3],x:e.offsetX,y:e.offsetY,config:{}});save();render()};canvas.onclick=()=>{sel=null;render()};search.oninput=e=>library(e.target.value);layout.onclick=()=>{nodes.forEach((n,i)=>{n.x=80+(i%4)*270;n.y=100+Math.floor(i/4)*150});save();render()};publish.onclick=()=>alert('Bağımsız Jazz Supabase projesi bağlandığında sürümlü yayın aktif olacak.');library();render();</script></body></html>
