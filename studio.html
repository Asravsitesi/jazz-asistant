<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d0f14"><title>Jazz Flow Studio</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="components.css"><link rel="stylesheet" href="responsive.css"><style>body{overflow:hidden}.studio{height:100vh;display:grid;grid-template:64px 1fr/260px 1fr 300px}.studio-top{grid-column:1/4;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line);background:#0b0d12}.studio-top .brand{padding:0 12px 0 0;border-right:1px solid var(--line)}.studio-top>a{text-decoration:none;color:var(--muted)}.studio-top select{height:36px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:#fff;padding:0 10px}.studio-top .push{margin-left:auto}.library,.inspector{padding:15px;background:#0f1117;overflow:auto}.library{border-right:1px solid var(--line)}.inspector{border-left:1px solid var(--line)}.library input{width:100%;height:40px;padding:0 11px;border:1px solid var(--line);border-radius:8px;background:#0b0e13;color:#fff}.group-title{margin:18px 7px 7px;color:#5f6776;font-size:10px;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.module{width:100%;display:grid;grid-template-columns:34px 1fr;gap:10px;align-items:center;padding:9px;border:1px solid transparent;border-radius:9px;background:transparent;color:#c3c8d2;text-align:left;cursor:grab}.module:hover{border-color:var(--line);background:var(--panel)}.module i{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;background:#1d2331;color:var(--blue);font-style:normal}.module b,.module small{display:block}.module b{font-size:12px}.module small{color:var(--muted);font-size:10px}.canvas{position:relative;overflow:hidden;background-color:#0c0e13;background-image:radial-gradient(#29303b 1px,transparent 1px);background-size:24px 24px}.scene{position:absolute;width:4000px;height:3000px;transform-origin:0 0}.flow-head{position:absolute;z-index:5;left:18px;top:16px;display:flex;align-items:center;gap:8px;padding:7px;border:1px solid var(--line);border-radius:9px;background:rgba(17,20,27,.9);backdrop-filter:blur(8px)}.zoom{position:absolute;z-index:5;right:18px;bottom:18px;display:flex;border:1px solid var(--line);border-radius:9px;background:var(--panel)}.zoom button{width:38px;height:36px;border:0;background:transparent}.node{position:absolute;width:220px;border:1px solid #343b49;border-radius:12px;background:#161922;box-shadow:0 12px 30px rgba(0,0,0,.24);user-select:none}.node.selected{border-color:var(--blue);box-shadow:0 0 0 2px rgba(139,165,255,.12),0 16px 35px #0008}.node-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}.node-head i{width:27px;height:27px;display:grid;place-items:center;border-radius:7px;background:#20283a;color:var(--blue);font-style:normal}.node-head b{font-size:11px}.node-body{padding:12px}.node-body strong{display:block;font-size:13px}.node-body small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.port{position:absolute;top:50%;width:13px;height:13px;border:2px solid #0c0e13;border-radius:50%;background:#6678a9}.port.in{left:-7px}.port.out{right:-7px}.inspector h2{font-size:16px;margin:6px 0}.inspector p{color:var(--muted);font-size:12px}.field{display:grid;gap:6px;margin:16px 0}.field label{color:#7d8492;font-size:10px;text-transform:uppercase;letter-spacing:.08em}.field input,.field textarea,.field select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0b0e13;color:#fff}.field textarea{height:150px;resize:vertical}.inspector-empty{height:100%;display:grid;place-content:center;text-align:center;color:var(--muted)}.run-log{position:absolute;z-index:8;right:18px;top:18px;width:280px;display:none;padding:15px;border:1px solid #34405a;border-radius:11px;background:#121620;box-shadow:var(--shadow)}.run-log.show{display:block}.run-step{padding:8px 0;border-bottom:1px solid var(--line);font-size:11px}.run-step:before{content:'✓';color:var(--green);margin-right:8px}@media(max-width:900px){.studio{grid-template:64px 1fr/1fr}.studio-top{grid-column:1;gap:7px;padding:0 8px;min-width:0}.library,.inspector{display:none}.studio-top .brand div,.studio-top select,#undo,#layout{display:none}.studio-top .brand{padding:0;border:0}.studio-top>a{font-size:0}.studio-top>a:after{content:'←';font-size:18px}.studio-top .push{margin-left:auto}.studio-top .btn{padding:0 10px}}</style></head><body><div class="studio"><header class="studio-top"><div class="brand"><span class="brand-mark">J</span><div><b>Flow Studio</b><small>Jazz Orchestration</small></div></div><a href="index.html">← Uygulama</a><select id="flow-select"><option>Günlük Brifing</option><option>Notion İçerik Asistanı</option><option>Haftalık Değerlendirme</option></select><button class="btn" id="undo">↶</button><button class="btn" id="layout">Otomatik düzen</button><button class="btn push" id="run">▶ Test et</button><button class="btn primary" id="publish">Yayınla</button></header><aside class="library"><input id="module-search" placeholder="Modül ara…"><div id="module-list"></div></aside><main class="canvas" id="canvas"><div class="flow-head"><span class="tag">AKTİF AKIŞ</span><b>Günlük Brifing</b><span id="node-count">0 modül</span></div><div class="scene" id="scene"></div><div class="run-log" id="run-log"><span class="eyebrow">TEST ÇALIŞMASI</span><h3>Akış yürütülüyor</h3><div id="run-steps"></div></div><div class="zoom"><button id="zoom-out">−</button><button id="zoom-label">100%</button><button id="zoom-in">＋</button></div></main><aside class="inspector" id="inspector"></aside></div><div class="toast" id="toast"></div><script src="studio.js"></script></body></html>
