<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11101a"><title>Jazz Asistant</title><link rel="manifest" href="manifest.webmanifest"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><style>:root{--violet:#7c5cff;--cyan:#4ad7d1;--ink:#eeeef8;--muted:#9b9bad;--panel:#191824;--line:#2b2938}*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui;background:#0d0c14;color:var(--ink)}button,input,textarea{font:inherit}.app{height:100%;display:grid;grid-template-columns:250px 1fr}.side{background:#12111b;border-right:1px solid var(--line);padding:18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;gap:11px;font-size:18px;font-weight:850}.logo{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(135deg,var(--violet),var(--cyan));box-shadow:0 10px 30px #7c5cff45}.new{margin:24px 0 14px;border:1px solid #5f4bd0;background:#211d3d;color:#fff;padding:11px;border-radius:11px}.threads{display:grid;gap:6px;overflow:auto}.thread{border:0;background:transparent;color:#aaaabd;text-align:left;padding:10px;border-radius:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.thread.active,.thread:hover{background:#211f2d;color:#fff}.side-foot{margin-top:auto;display:grid;gap:8px}.side-foot a,.side-foot button{color:#aaaabd;background:transparent;border:0;text-align:left;text-decoration:none;padding:8px}.main{min-width:0;display:grid;grid-template-rows:62px 1fr auto;background:radial-gradient(circle at 50% -20%,#292248,#0d0c14 40%)}header{display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line);background:#11101add;backdrop-filter:blur(18px)}header b{font-size:14px}header span{font-size:11px;color:var(--muted);margin-left:10px}header .actions{margin-left:auto;display:flex;gap:8px}header button{border:1px solid var(--line);background:#1d1b28;color:#dcdbea;border-radius:9px;padding:8px 10px}.messages{overflow:auto;padding:30px max(20px,calc((100% - 820px)/2));scroll-behavior:smooth}.empty{text-align:center;margin:12vh auto;max-width:650px}.empty .orb{width:78px;height:78px;margin:auto;border-radius:25px;background:linear-gradient(135deg,#7c5cff,#4ad7d1);filter:drop-shadow(0 18px 35px #7c5cff50);display:grid;place-items:center;font-size:30px}.empty h1{font-size:35px;margin:22px 0 10px}.empty p{color:var(--muted);line-height:1.6}.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:9px;margin-top:25px}.chips button{border:1px solid var(--line);background:#171621;color:#c8c7d4;border-radius:99px;padding:10px 14px}.msg{display:grid;grid-template-columns:32px 1fr;gap:12px;margin:20px 0}.msg.user{grid-template-columns:1fr 32px}.msg.user .bubble{grid-column:1}.msg.user .avatar{grid-column:2;grid-row:1}.avatar{width:32px;height:32px;border-radius:10px;background:#262337;display:grid;place-items:center;font-size:12px}.msg.ai .avatar{background:linear-gradient(135deg,#7659f8,#36bdb8)}.bubble{max-width:720px;line-height:1.6;color:#deddea}.user .bubble{justify-self:end;background:#292440;border:1px solid #40375e;padding:12px 15px;border-radius:16px 5px 16px 16px}.composer-wrap{padding:12px max(16px,calc((100% - 850px)/2)) 22px;background:linear-gradient(transparent,#0d0c14 30%)}.composer{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:end;border:1px solid #3b374c;background:#181721;border-radius:18px;padding:9px;box-shadow:0 15px 50px #0008}.composer textarea{border:0;background:transparent;color:white;resize:none;outline:none;min-height:42px;max-height:150px;padding:11px}.composer button{width:42px;height:42px;border:0;border-radius:12px;background:#242231;color:#ccc}.composer .send{background:linear-gradient(135deg,#7c5cff,#5d45cb);color:white}.status{font-size:11px;color:#88879a;padding:5px 4px 0}.listening{color:#4ad7d1!important}@media(max-width:720px){.app{grid-template-columns:1fr}.side{display:none}.messages{padding:20px 14px}.empty h1{font-size:28px}.composer-wrap{padding:9px}.main{height:100dvh}}</style></head><body><div class="app"><aside class="side"><div class="brand"><span class="logo">J</span>Jazz Asistant</div><button class="new" id="newChat">＋ Yeni konuşma</button><div class="threads" id="threads"></div><div class="side-foot"><a href="studio.html">◫ Jazz Studio</a><button id="install">⬇ Masaüstüne yükle</button><button id="clear">⌫ Geçmişi temizle</button></div></aside><main class="main"><header><b id="title">Yeni konuşma</b><span id="provider">Akıllı yönlendirme</span><div class="actions"><button id="voiceToggle">🔊 Ses açık</button><button onclick="location.href='studio.html'">Studio</button></div></header><section class="messages" id="messages"></section><div class="composer-wrap"><div class="composer"><button id="attach">＋</button><textarea id="input" rows="1" placeholder="Jazz'a bir şey söyleyin…"></textarea><button id="mic">⌁</button><button class="send" id="send">➤</button><input id="file" type="file" hidden></div><div class="status" id="status">Hazır · Anahtarlar yalnızca güvenli sunucuda tutulur</div></div></main></div><script>const cfg=window.JAZZ_CONFIG||{},state={threads:JSON.parse(localStorage.jazzThreads||'[]'),id:null,voice:true,file:null};const $=s=>document.querySelector(s);function save(){localStorage.jazzThreads=JSON.stringify(state.threads)}function current(){return state.threads.find(x=>x.id===state.id)}function clean(x){return String(x).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}function newThread(){const x={id:crypto.randomUUID(),title:'Yeni konuşma',messages:[],createdAt:Date.now()};state.threads.unshift(x);state.id=x.id;save();render()}function render(){if(!state.threads.length)return newThread();if(!state.id)state.id=state.threads[0].id;const t=current();$('#title').textContent=t.title;$('#threads').innerHTML=state.threads.map(x=>`<button class="thread ${x.id===state.id?'active':''}" data-id="${x.id}">${clean(x.title)}</button>`).join('');document.querySelectorAll('.thread').forEach(b=>b.onclick=()=>{state.id=b.dataset.id;render()});$('#messages').innerHTML=t.messages.length?t.messages.map(m=>`<div class="msg ${m.role==='user'?'user':'ai'}"><span class="avatar">${m.role==='user'?'S':'J'}</span><div class="bubble">${clean(m.content).replace(/\n/g,'<br>')}</div></div>`).join(''):`<div class="empty"><div class="orb">J</div><h1>Bugün ne yapıyoruz?</h1><p>Konuşun, yazın veya dosya ekleyin. Jazz; bağlı araçlarınız, modelleriniz ve oluşturduğunuz akışlarla birlikte çalışan kişisel asistanınızdır.</p><div class="chips"><button>Bugünümü planla</button><button>Bir araştırma yap</button><button>Dosyayı analiz et</button><button>Yeni bir proje oluştur</button></div></div>`;$('#messages').scrollTop=$('#messages').scrollHeight}async function send(text=$('#input').value.trim()){if(!text)return;const t=current();t.messages.push({role:'user',content:text});if(t.messages.length===1)t.title=text.slice(0,42);$('#input').value='';render();save();$('#status').textContent='Jazz düşünüyor…';try{let answer;if(!cfg.SUPABASE_URL||!cfg.SUPABASE_PUBLISHABLE_KEY)answer='Jazz Asistant arayüzü hazır. Bağımsız Supabase projesi bağlandığında çoklu model yönlendirmesi ve araçlar aktif olacaktır.';else{const s=supabase.createClient(cfg.SUPABASE_URL,cfg.SUPABASE_PUBLISHABLE_KEY),{data:{session}}=await s.auth.getSession(),r=await fetch(cfg.FUNCTION_URL||cfg.SUPABASE_URL+'/functions/v1/chat-runtime',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({messages:t.messages,conversationId:t.id,maxTokens:cfg.DEFAULT_MAX_TOKENS||4096})}),d=await r.json();if(!r.ok)throw Error(d.error||'Yanıt alınamadı');answer=d.answer;$('#provider').textContent=d.provider||'Akıllı yönlendirme'}t.messages.push({role:'assistant',content:answer});save();render();if(state.voice)speak(answer)}catch(e){t.messages.push({role:'assistant',content:'Bağlantı hatası: '+e.message});save();render()}$('#status').textContent='Hazır'}function speak(text){speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='tr-TR';const vs=speechSynthesis.getVoices();u.voice=vs.find(v=>/female|google türkçe|yelda|emel/i.test(v.name))||vs.find(v=>v.lang?.startsWith('tr'))||null;speechSynthesis.speak(u)}$('#send').onclick=()=>send();$('#input').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};document.addEventListener('click',e=>{if(e.target.closest('.chips button'))send(e.target.textContent)});$('#newChat').onclick=newThread;$('#clear').onclick=()=>{if(confirm('Tüm yerel konuşmalar silinsin mi?')){state.threads=[];state.id=null;render()}};$('#voiceToggle').onclick=()=>{state.voice=!state.voice;$('#voiceToggle').textContent=state.voice?'🔊 Ses açık':'🔇 Ses kapalı'};$('#attach').onclick=()=>$('#file').click();$('#file').onchange=e=>{$('#status').textContent=e.target.files[0]?'Dosya hazır: '+e.target.files[0].name:'Hazır'};const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(SR){const r=new SR();r.lang='tr-TR';r.interimResults=true;r.onstart=()=>{$('#status').textContent='Sizi dinliyorum…';$('#status').classList.add('listening')};r.onresult=e=>{$('#input').value=Array.from(e.results).map(x=>x[0].transcript).join('')};r.onend=()=>{$('#status').classList.remove('listening');if($('#input').value.trim())send()};$('#mic').onclick=()=>r.start()}let installPrompt;addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPrompt=e});$('#install').onclick=()=>installPrompt?installPrompt.prompt():alert('Tarayıcı menüsünden Uygulamayı yükle seçeneğini kullanın.');navigator.serviceWorker?.register('sw.js');render();</script></body></html>
